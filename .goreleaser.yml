---
project_name: path-helper
dist: ./bin/dist

builds:
  - id: path-helper
    binary: path-helper
    main: cmd/path-helper/main.go
    goos:
      - linux
      - darwin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
